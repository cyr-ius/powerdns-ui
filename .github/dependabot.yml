# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
# master is protected and only receives merges of dev: every update targets dev
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Python dependencies (pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      fastapi-pydantic:
        patterns:
          - "fastapi"
          - "pydantic"
          - "pydantic-settings"
      sqlmodel-sqlalchemy:
        patterns:
          - "sqlmodel"
          - "sqlalchemy"
          - "alembic"

  # Web interface (Angular)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
          - "rxjs"
          - "typescript"

  # Base images of the Dockerfile (node, python, uv) and of docker-compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

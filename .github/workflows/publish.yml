name: Build & publish to Docker registries

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  check-version:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      # Ensure the pushed tag matches the versions declared in pyproject.toml and package.json
      - name: Check tag matches version
        run: |
          VERSION=$(uv version --short)
          FRONTEND_VERSION=$(jq -r .version frontend/package.json)
          if [ "${VERSION}" != "${GITHUB_REF_NAME}" ] || [ "${FRONTEND_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject (${VERSION}) or frontend (${FRONTEND_VERSION}) version"
            exit 1
          fi

  # Images on GitHub Container Registry and Docker Hub, after the tag check
  docker:
    needs: check-version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true
    secrets: inherit

  github-release:
    needs: docker
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}

# `prek install` installs the pre-commit hooks and the agent-review post-commit hook
repos:
  # ── General ──────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: swagger
      - id: trailing-whitespace
      - id: check-json
        exclude: .devcontainer|.vscode|tsconfig.*
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: .devcontainer|.vscode|.agents
      - id: detect-private-key
        exclude: ^tests/

  # ── Python: Ruff (formatter + linter + import sort) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        exclude: .agents
      - id: ruff-format
        exclude: .agents

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=pdns,Powerdns,tsigkeys,autoprimaries,redoc
          - --skip="./.*,*.csv,*.json,*.ambr"
          - --quiet-level=2
        exclude_types: [csv, json, html]
        exclude: .devcontainer|.agents|swagger

  # ── TypeScript / Angular: Prettier ───────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ["--print-width=120"]
        types_or: [javascript, html, css, scss, json, yaml, markdown]
        # docs/ is excluded because Prettier reflows the indented admonition
        # bodies used by the MkDocs (pymdownx.admonition) syntax and breaks them.
        exclude: node_modules|.agents|swagger|^docs/

  - repo: local
    hooks:
      - id: scan-deps
        name: dependency scan
        entry: uvx --isolated security-review-ci@latest scan-deps --skip-unconfigured --require-database --allow-http --save --project powerdns-ui
        language: system
        files: ^(uv\.lock|pyproject\.toml|frontend/package(-lock)?\.json)$
      - id: agent-review
        name: agent security review
        entry: uvx --isolated security-review-ci@latest agent-review --project powerdns-ui
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
